server {
    listen 80;
    server_name starmeet.app www.starmeet.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name starmeet.app www.starmeet.app;

    ssl_certificate /etc/letsencrypt/live/starmeet.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starmeet.app/privkey.pem;

    # Static Web App Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Endpoints
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets & Socket.IO Signaling Server
    location /socket.io/ {
        proxy_pass http://localhost:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
